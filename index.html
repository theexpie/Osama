<style>
:root{color-scheme:dark;--bg:#080d15;--panel:#111b29;--panel2:#182638;--line:rgba(142,183,220,.17);--text:#e8f0f8;--muted:#8296aa;--soft:#b7c8d8;--accent:#d6a85f;--accent2:#668eb5;--radius:18px;--ease:cubic-bezier(.2,.75,.25,1);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:var(--bg);color:var(--text)}button,input{font:inherit}button{color:inherit}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.browser{height:100dvh;min-height:0;display:flex;flex-direction:column;position:relative;isolation:isolate;background:radial-gradient(ellipse at 78% -20%,rgba(73,119,166,.20),transparent 42%),var(--bg)}

.tab:hover{background:#ffffff08;color:#dce7f3}.tab.active{background:linear-gradient(180deg,#172332,#121c28);border-color:#ffffff12;color:#f3f7fc}
.tab-mark{width:17px;height:17px;flex:none;opacity:.78}.tab-title{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:left}
.tab-close{width:23px;height:23px;border:0;border-radius:7px;background:transparent;color:#8493a5;font-size:17px;display:grid;place-items:center;cursor:pointer;opacity:.65;transition:background .2s,opacity .2s}

.toolbar{height:58px;min-height:58px;display:flex;align-items:center;gap:5px;padding:7px 12px;background:rgba(14,21,31,.84);border-bottom:1px solid var(--line);backdrop-filter:blur(20px)}

.tool-btn:hover:not(:disabled){background:#ffffff0c;color:#edf4fc;transform:translateY(-1px)}.tool-btn:disabled{opacity:.27;cursor:default}
.address-shell{height:39px;min-width:0;flex:1;display:flex;align-items:center;gap:9px;padding:0 13px;border:1px solid rgba(196,215,237,.13);border-radius:13px;background:#101a27;transition:border-color .22s,box-shadow .22s,background .22s}

.address::placeholder{color:#65768a}
.address-actions{display:flex;align-items:center;gap:2px}
.menu-wrap{position:relative}
.menu{position:absolute;z-index:30;right:0;top:43px;width:218px;padding:7px;border:1px solid #344252;border-radius:15px;background:rgba(18,28,41,.97);box-shadow:0 20px 60px #0009;backdrop-filter:blur(22px);transform:translateY(-6px) scale(.97);transform-origin:top right;opacity:0;visibility:hidden;transition:opacity .18s,transform .22s var(--ease),visibility .22s}
.menu.open{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
.menu button{width:100%;display:flex;align-items:center;gap:10px;padding:10px;border:0;border-radius:9px;background:transparent;text-align:left;color:#d5e0ed;font-size:12px;cursor:pointer}
.menu button:hover{background:#ffffff10}.menu-sep{height:1px;background:#ffffff12;margin:5px 3px}
.content{position:relative;flex:1;min-height:0;overflow:hidden;background:#0b111a}
.home{position:absolute;inset:0;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:clamp(28px,6vh,70px) 22px 32px;opacity:1;transform:translateY(0);transition:opacity .34s,transform .44s var(--ease);background:radial-gradient(ellipse at 50% 20%,rgba(83,125,169,.15),transparent 42%),transparent}
.home.leaving{opacity:0;transform:translateY(9px);pointer-events:none}
.home-inner{width:min(900px,100%);margin:auto;display:flex;flex-direction:column;align-items:center}
.eyebrow{color:#8fb4d7}.hero-title{color:#eef4fa}.hero-sub{color:#9aafc4}.launch{background:rgba(19,34,51,.88);border-color:rgba(129,174,214,.18)}.launch:hover{background:#1c3046;border-color:#86b5df66}.launch-icon{background:#29435c;color:#dceeff}.section-label{color:#9bb9d6}.section-note,.search-foot{color:#8198b0}.brand-mark{filter:drop-shadow(0 2px 8px #7eb5e035)}.hero-mark{filter:drop-shadow(0 8px 24px #7eb5e035)}.hero-mark{width:64px;height:76px;display:grid;place-items:center;margin-bottom:22px;animation:float 6s ease-in-out infinite;filter:drop-shadow(0 8px 24px #8ab9ed28)}
.hero-mark svg{width:54px;height:66px}
.eyebrow{color:#8395aa;font-size:10px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:13px}

.search-card:focus-within{border-color:#83a9d0;box-shadow:0 0 0 4px #8ab8e51a,0 18px 48px #0004;transform:translateY(-2px)}

.go-btn{height:40px;min-width:43px;padding:0 15px;border:0;border-radius:12px;background:#d6a85f;color:#111923;font-size:12px;font-weight:650;cursor:pointer;transition:transform .2s,background .2s}
.go-btn:hover{background:white;transform:translateY(-1px)}

.section-top{display:flex;align-items:center;justify-content:space-between;margin:0 2px 13px}
.section-label{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#8394a8}
.section-note{font-size:10px;color:#64758a}
.launch-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.launch{min-width:0;display:flex;align-items:center;gap:11px;padding:12px 13px;border:1px solid rgba(201,220,240,.10);border-radius:13px;background:rgba(17,29,43,.82);text-align:left;cursor:pointer;transition:transform .22s var(--ease),border-color .22s,background .22s}
.launch:hover{transform:translateY(-3px);border-color:#a4c7e044;background:#1a293a}
.launch-icon{width:31px;height:31px;flex:none;border-radius:10px;background:#243c55;display:grid;place-items:center;color:#dceeff;font-size:12px;font-weight:650}
.launch-copy{min-width:0}.launch-copy b{display:block;font-size:11px;font-weight:570;color:#d9e4f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.launch-copy small{display:block;font-size:9px;color:#72849a;margin-top:3px}
.bottom-note{margin-top:clamp(30px,6vh,60px);display:flex;align-items:center;gap:8px;color:#607187;font-size:10px}
.bottom-note span{width:5px;height:5px;border-radius:50%;background:#86a8ca;box-shadow:0 0 10px #86a8ca66}
.page-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;opacity:0;transition:opacity .28s ease}
.page-frame.visible{opacity:1}
.loading-line{position:absolute;z-index:15;left:0;right:0;top:0;height:2px;opacity:0;pointer-events:none;background:linear-gradient(90deg,transparent,#9ec8ef,transparent);transform:translateX(-100%)}
.loading-line.run{opacity:1;animation:loadline 1.2s ease-in-out infinite}
.toast{position:absolute;z-index:40;left:50%;bottom:20px;transform:translate(-50%,12px);padding:10px 14px;border:1px solid #ffffff1b;border-radius:11px;background:#1b2939;color:#e5eef8;font-size:11px;box-shadow:0 12px 35px #0008;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes tab-in{from{opacity:0;transform:translateY(7px) scale(.97)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}

}
@media(max-width:380px){

}

 .hero-title{font-size:34px}.hero-sub{margin:8px 0 0;font-size:11px}.search-card,.search-foot,.launch-section{grid-column:2}.search-card{grid-row:1;margin-top:10px}.search-foot{grid-row:2}.launch-section{grid-row:3;margin-top:15px}.section-top{margin-bottom:7px}.launch{padding:7px 9px}.launch-grid{gap:6px}.bottom-note{display:none}
}

<body>
<div class="browser" id="browser">
 <div class="topline"><div class="brand"><svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M5 34.5 27 29 39 7q2-3 5-1l-5 22 17 7q3 1 3 4l-21-1-8 16-4-1 2-16-20 1z" fill="#d6a85f" stroke="#f0cc8a" stroke-width="1.2" stroke-linejoin="round"/></svg><span>Osama</span></div><div class="topline-spacer"></div><span class="top-hint">probably works</span></div>
 <div class="tabs-row"><div class="tabs" id="tabs"></div><button class="new-tab" id="newTab" title="New tab" aria-label="New tab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>

<script>
/* Scramjet bridge: initialize your Scramjet controller, then expose
   window.OSAMA_ADAPTER = { navigate(url, context), back(context),
   forward(context), reload(context) }. context.frame is the active iframe.
   This UI intentionally does not pretend that Scramjet is bundled or ready. */
(()=>{
 const $=id=>document.getElementById(id),tabsEl=$('tabs'),address=$('address'),home=$('home'),frame=$('pageFrame'),menu=$('menu'),toast=$('toast'),loading=$('loadingLine');
 let tabs=[],activeId=0,nextId=1,toastTimer,loadTimer;
 const current=()=>tabs.find(t=>t.id===activeId);
 const host=url=>{try{return new URL(url).hostname.replace(/^www\./,'')}catch{return 'New tab'}};
 function notify(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2300)}
 function renderTabs(){
  tabsEl.innerHTML='';
  tabs.forEach(t=>{
   const b=document.createElement('button');b.type='button';b.className='tab'+(t.id===activeId?' active':'');b.setAttribute('aria-label','Switch to '+t.title);
   b.innerHTML='<svg class="tab-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg><span class="tab-title"></span><span class="tab-close" role="button" aria-label="Close tab">×</span>';
   b.querySelector('.tab-title').textContent=t.title;
   b.addEventListener('click',e=>{if(e.target.closest('.tab-close')){e.stopPropagation();closeTab(t.id)}else activate(t.id)});
   tabsEl.appendChild(b);
  });
 }
 function contextFor(t){return{frame,tabId:t.id,setTitle:s=>{t.title=String(s||'Page');renderTabs()},setAddress:s=>{t.url=s;if(t.id===activeId)address.value=s},showHome:()=>showHome(t)}}
 function updateNav(){const t=current();$('back').disabled=!t||t.index<=0;$('forward').disabled=!t||t.index>=t.history.length-1}
 function activate(id){
  const previous=current();if(previous&&previous.id!==id&&!previous.isHome)previous.needsRender=true;
  activeId=id;const t=current();if(!t)return;
  address.value=t.url||'';home.classList.toggle('leaving',!t.isHome);frame.classList.toggle('visible',!t.isHome);frame.style.display=t.isHome?'none':'block';home.style.display=t.isHome?'flex':'none';
  if(!t.isHome&&t.url&&t.needsRender){t.needsRender=false;renderUrl(t,true)}
  renderTabs();updateNav();menu.classList.remove('open')
 }
 function createTab(url=''){
  const t={id:nextId++,title:'New tab',url:'',isHome:true,history:[],index:-1,needsRender:false};
  tabs.push(t);activate(t.id);if(url)navigate(url);else address.value='';
 }
 function closeTab(id){const i=tabs.findIndex(t=>t.id===id);if(i<0)return;tabs.splice(i,1);if(!tabs.length){createTab();return}if(activeId===id)activate(tabs[Math.max(0,i-1)].id);else renderTabs()}
 function showHome(t=current()){if(!t)return;t.isHome=true;t.url='';t.title='New tab';t.needsRender=false;if(t.id===activeId){home.style.display='flex';home.classList.remove('leaving');frame.classList.remove('visible');frame.style.display='none';address.value=''}renderTabs();updateNav()}
 function normalize(raw){
  let s=String(raw||'').trim();if(!s)return'';
  if(/^(javascript:|data:|file:|about:)/i.test(s))return'';
  if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)){
   if(s.includes(' ')||!s.includes('.')||s.startsWith('?'))return'https://duckduckgo.com/?q='+encodeURIComponent(s.replace(/^\?/,''));
   s='https://'+s;
  }
  try{const u=new URL(s);return['http:','https:'].includes(u.protocol)?u.href:''}catch{return''}
 }
 function renderUrl(t,fromHistory=false){
  const a=window.OSAMA_ADAPTER;
  clearTimeout(loadTimer);loading.classList.add('run');frame.classList.remove('visible');
  if(a&&typeof a.navigate==='function'){
   try{a.navigate(t.url,contextFor(t));loadTimer=setTimeout(()=>{loading.classList.remove('run');if(t.id===activeId)frame.classList.add('visible')},650)}
   catch(err){loading.classList.remove('run');notify('Scramjet error: '+(err?.message||'unknown error'))}
  }else{
   loading.classList.remove('run');frame.srcdoc='<meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:14px system-ui;color:#344255;background:#f5f7fa;padding:32px;line-height:1.6}main{max-width:620px;margin:10vh auto;background:white;border:1px solid #e1e7ee;border-radius:18px;padding:28px}h2{font-weight:600}code{background:#edf1f6;padding:3px 6px;border-radius:5px}</style><main><h2>Osama is ready for its engine.</h2><p>The browser interface is running, but the Scramjet adapter has not been connected yet.</p><p>Connect <code>window.OSAMA_ADAPTER.navigate()</code> to load this destination through your proxy.</p><p style="color:#7a8797;overflow-wrap:anywhere">'+t.url.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</p></main>';
   frame.classList.add('visible');
  }
 }
 function navigate(raw,fromHistory=false){
  const url=normalize(raw);if(!url){notify('Enter a valid web address or search term.');return}
  const t=current();if(!t)return;t.url=url;t.title=host(url);t.isHome=false;t.needsRender=false;
  if(!fromHistory){t.history=t.history.slice(0,t.index+1);t.history.push(url);t.index=t.history.length-1}
  address.value=url;home.style.display='none';home.classList.add('leaving');frame.style.display='block';renderTabs();updateNav();renderUrl(t,fromHistory);
 }
 function goHistory(dir){const t=current();if(!t)return;const i=t.index+dir;if(i<0||i>=t.history.length)return;t.index=i;t.url=t.history[i];navigate(t.url,true)}
 $('addressForm').addEventListener('submit',e=>{e.preventDefault();navigate(address.value)});
 $('searchForm').addEventListener('submit',e=>{e.preventDefault();navigate($('searchInput').value)});
 $('newTab').addEventListener('click',()=>createTab());
 $('back').addEventListener('click',()=>{const a=window.OSAMA_ADAPTER;if(a?.back)a.back(contextFor(current()));else goHistory(-1)});
 $('forward').addEventListener('click',()=>{const a=window.OSAMA_ADAPTER;if(a?.forward)a.forward(contextFor(current()));else goHistory(1)});
 $('reload').addEventListener('click',()=>{const a=window.OSAMA_ADAPTER;if(a?.reload)a.reload(contextFor(current()));else if(current()?.url)renderUrl(current())});
 $('homeBtn').addEventListener('click',()=>showHome());
 $('menuBtn').addEventListener('click',e=>{e.stopPropagation();menu.classList.toggle('open')});
 menu.addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;menu.classList.remove('open');if(a==='new')createTab();if(a==='home')showHome();if(a==='reload')$('reload').click();if(a==='copy'){navigator.clipboard?.writeText(current()?.url||'').then(()=>notify('Address copied')).catch(()=>notify('Clipboard unavailable'))}if(a==='fullscreen'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}if(a==='about')notify('Osama · browser interface')});
 document.querySelectorAll('[data-url]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.url)));
 document.addEventListener('click',e=>{if(!menu.contains(e.target)&&e.target!==$('menuBtn'))menu.classList.remove('open')});
 document.addEventListener('keydown',e=>{
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='l'){e.preventDefault();address.focus();address.select()}
  if(mod&&e.key.toLowerCase()==='t'){e.preventDefault();createTab()}
  if(mod&&e.key.toLowerCase()==='w'){e.preventDefault();closeTab(activeId)}
  if(mod&&e.key.toLowerCase()==='r'){e.preventDefault();$('reload').click()}
  if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();$('back').click()}
  if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();$('forward').click()}
  if(e.key==='Escape')menu.classList.remove('open')
 });
 frame.addEventListener('load',()=>{if(!current()?.isHome){loading.classList.remove('run');frame.classList.add('visible')}});
 window.OSAMA_UI={navigate,showHome,newTab:()=>createTab(),getTabs:()=>tabs.map(({id,title,url})=>({id,title,url}))};
 createTab();
})();
</script>
</body>
