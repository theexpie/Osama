<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1b22">
<title>Browser</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%237b72c8'/%3E%3Cpath d='M13 35c4-15 17-23 31-17 7 3 10 10 7 17-3 9-13 15-23 13-8-1-14-6-15-13z' fill='none' stroke='white' stroke-width='5'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--chrome:#24232b;--chrome2:#302e38;--line:#403d49;--page:#1c1b22;--text:#f5f3fa;--muted:#b7b3c1;--accent:#b6a9ff;--rail:#25232d;font-family:Inter,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:var(--page);color:var(--text)}button,input{font:inherit}button{color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100dvh;display:grid;grid-template-columns:36px minmax(0,1fr);grid-template-rows:38px 36px minmax(0,1fr);background:var(--page)}
.tabsbar{grid-column:1/3;grid-row:1;display:flex;align-items:stretch;gap:4px;padding:4px 8px 0 6px;background:#292631;border-bottom:1px solid #3a3742;min-width:0}
.tablist{display:flex;align-items:stretch;gap:4px;min-width:0;overflow:auto;scrollbar-width:none;flex:1}.tablist::-webkit-scrollbar{display:none}
.tab{position:relative;display:flex;align-items:center;gap:8px;min-width:130px;max-width:240px;flex:0 1 190px;padding:0 10px;border:1px solid transparent;border-bottom:0;border-radius:9px 9px 0 0;background:transparent;color:#c9c5d1;cursor:pointer;font-size:11px;text-align:left}
.tab:hover{background:#ffffff0b}.tab.active{background:#454151;border-color:#575263;color:#fff}
.favicon{width:14px;height:14px;flex:none;border-radius:4px;background:#77708b;display:grid;place-items:center;font-size:9px;color:#fff}
.tabname{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}.close{width:19px;height:19px;border:0;border-radius:50%;background:transparent;color:#c8c4d0;display:grid;place-items:center;cursor:pointer;font-size:15px;line-height:1}.close:hover{background:#ffffff1b;color:white}
.addtab,.windowbtn,.iconbtn{border:0;background:transparent;color:#d1cdd8;display:grid;place-items:center;cursor:pointer}
.addtab{width:30px;align-self:center;height:29px;border-radius:7px;font-size:20px;font-weight:300}.addtab:hover,.windowbtn:hover,.iconbtn:hover{background:#ffffff12}
.windowcontrols{display:flex;align-items:stretch;margin-left:auto;flex:none}.windowbtn{width:38px;font-size:13px}.windowbtn.closewin:hover{background:#c42b3a}
.toolbar{grid-column:2;grid-row:2;display:flex;align-items:center;gap:4px;padding:3px 10px;background:#292631;border-bottom:1px solid #3a3742;min-width:0}
.iconbtn{width:29px;height:28px;border-radius:7px;flex:none}.iconbtn:disabled{opacity:.3;cursor:default}.iconbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.addressbox{height:28px;min-width:80px;max-width:850px;flex:1;display:flex;align-items:center;gap:8px;padding:0 10px;border:1px solid #4a4654;border-radius:8px;background:#1e1d24;transition:border-color .16s,background .16s}
.addressbox:focus-within{border-color:#8e82c9;background:#201f28}.siteicon{width:14px;height:14px;flex:none;color:#aaa4b8}
#address{width:100%;min-width:0;border:0;outline:0;background:transparent;color:#f6f4fa;font-size:11px}#address::placeholder{color:#a49eae}
.righttools{display:flex;align-items:center;gap:3px;flex:none}.sidebar{grid-column:1;grid-row:2/4;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 3px;background:var(--rail);border-right:1px solid #3a3742}
.railbtn{width:29px;height:29px;border:0;border-radius:7px;background:transparent;color:#c4bfce;display:grid;place-items:center;cursor:pointer}.railbtn:hover,.railbtn.active{background:#ffffff13;color:#fff}.railbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.railspacer{flex:1}
.viewport{grid-column:2;grid-row:3;position:relative;min-width:0;min-height:0;background:var(--page);overflow:hidden}
.page{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}.page.show{display:block}
.empty{position:absolute;inset:0;background:#1c1b22;display:block}.empty.hidden{display:none}
.panel{position:absolute;z-index:10;left:44px;top:82px;width:min(330px,calc(100vw - 60px));max-height:calc(100% - 100px);overflow:auto;padding:12px;border:1px solid #4b4656;border-radius:12px;background:#292731;box-shadow:0 16px 45px #0008;display:none}.panel.open{display:block}.panelhead{display:flex;align-items:center;justify-content:space-between;padding:2px 3px 10px;font-size:12px;font-weight:650}.panelrow{display:flex;align-items:center;gap:9px;padding:9px;border-radius:7px;color:#ddd9e4;font-size:11px;overflow-wrap:anywhere}.panelrow:hover{background:#ffffff0c}.panelrow button{margin-left:auto;border:0;background:transparent;color:#bdb7c9;cursor:pointer}.panelrow small{display:block;color:#a9a3b3;margin-top:3px}
.toast{position:absolute;bottom:18px;left:50%;transform:translate(-50%,8px);padding:8px 12px;border:1px solid #514b60;border-radius:8px;background:#302d39;color:#f4f1fa;font-size:11px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:620px){.app{grid-template-columns:32px minmax(0,1fr);grid-template-rows:36px 38px minmax(0,1fr)}.tabsbar{padding-left:4px;gap:2px}.tab{min-width:105px;flex-basis:145px;padding:0 7px;gap:5px}.windowbtn{width:27px}.toolbar{padding:3px 5px;gap:2px}.iconbtn{width:27px}.addressbox{padding:0 7px}.righttools{gap:0}.sidebar{padding-inline:1px}.railbtn{width:27px;height:28px}}
@media(orientation:landscape) and (max-height:430px){.app{grid-template-rows:32px 32px minmax(0,1fr)}.tabsbar{padding-top:2px}.tab{font-size:10px}.toolbar{padding-block:1px}.sidebar{padding-top:4px}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="tabsbar"><div class="tablist" id="tablist"></div><button class="addtab" id="newtab" title="New tab" aria-label="New tab">+</button><div class="windowcontrols"><button class="windowbtn" title="Minimize">−</button><button class="windowbtn" title="Maximize">□</button><button class="windowbtn closewin" title="Close">×</button></div></header>
<aside class="sidebar"><button class="railbtn" id="bookmarks" title="Bookmarks" aria-label="Bookmarks"><svg viewBox="0 0 24 24"><path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-4-6 4z"/></svg></button><button class="railbtn" id="history" title="History" aria-label="History"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></button><div class="railspacer"></div><button class="railbtn" id="settings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"/><path d="m19.4 15 .1.1 1.1 1.8-1.8 3.1-2.1-.5a8 8 0 0 1-1.7 1l-.5 2.1h-3.6l-.5-2.1a8 8 0 0 1-1.7-1l-2.1.5-1.8-3.1 1.1-1.8a8 8 0 0 1 0-2l-1.1-1.8 1.8-3.1 2.1.5a8 8 0 0 1 1.7-1l.5-2.1h3.6l.5 2.1a8 8 0 0 1 1.7 1l2.1-.5 1.8 3.1-1.1 1.8a8 8 0 0 1 0 2z" transform="translate(0 -1) scale(.9)"/></svg></button></aside>
<nav class="toolbar"><button class="iconbtn" id="back" title="Back" disabled><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><button class="iconbtn" id="forward" title="Forward" disabled><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button><button class="iconbtn" id="reload" title="Reload"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0 1 4M20 4v7h-7"/></svg></button><button class="iconbtn" id="home" title="Home"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></button>
<form class="addressbox" id="addressform"><svg class="siteicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><input id="address" placeholder="Search or enter address" autocomplete="off" spellcheck="false" aria-label="Search or enter address"></form>
<div class="righttools"><button class="iconbtn" id="save" title="Bookmark"><svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/></svg></button><button class="iconbtn" id="menu" title="Menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></div></nav>
<main class="viewport" id="viewport"><div class="empty" id="empty"></div><iframe class="page" id="page" title="Web page" referrerpolicy="no-referrer"></iframe><section class="panel" id="panel"><div class="panelhead"><span id="paneltitle">Bookmarks</span><button class="close" id="panelclose" aria-label="Close">×</button></div><div id="panelbody"></div></section><div class="toast" id="toast"></div></main>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id),list=$('tablist'),address=$('address'),page=$('page'),empty=$('empty'),panel=$('panel'),panelbody=$('panelbody'),toast=$('toast');
let tabs=[],active=0,next=1,closed=[],timer;
const current=()=>tabs.find(t=>t.id===active);
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch{return 'New Tab'}};
function say(s){toast.textContent=s;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1800)}
function draw(){list.replaceChildren();tabs.forEach(t=>{const b=document.createElement('button');b.className='tab'+(t.id===active?' active':'');b.innerHTML='<span class="favicon">◉</span><span class="tabname"></span><span class="close" role="button">×</span>';b.querySelector('.tabname').textContent=t.title;b.querySelector('.close').addEventListener('click',e=>{e.stopPropagation();close(t.id)});b.addEventListener('click',()=>activate(t.id));list.append(b)});const t=current();$('back').disabled=!t||t.pos<1;$('forward').disabled=!t||t.pos>=t.stack.length-1}
function activate(id){active=id;const t=current();address.value=t.url||'';empty.classList.toggle('hidden',!!t.url);page.classList.toggle('show',!!t.url);if(t.url&&t.needsLoad)load(t);draw();panel.classList.remove('open')}
function add(url){const t={id:next++,title:'New Tab',url:'',stack:[],pos:-1,needsLoad:false};tabs.push(t);activate(t.id);if(url)go(url)}
function close(id){const i=tabs.findIndex(t=>t.id===id);if(i<0)return;closed.push(tabs[i]);tabs.splice(i,1);if(!tabs.length)add();else if(active===id)activate(tabs[Math.max(0,i-1)].id);else draw()}
function clean(raw){let s=raw.trim();if(!s)return'';if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)){if(s.includes(' ')||!s.includes('.'))return'https://duckduckgo.com/?q='+encodeURIComponent(s);s='https://'+s}try{let u=new URL(s);return['http:','https:'].includes(u.protocol)?u.href:''}catch{return''}}
function load(t){t.needsLoad=false;const a=window.BROWSER_ADAPTER;if(a&&typeof a.navigate==='function'){a.navigate(t.url,{frame:page,tabId:t.id,setTitle:s=>{t.title=s;draw()}})}else{page.srcdoc='<body style="font:14px system-ui;background:#f5f5f7;color:#333;padding:30px"><h2>Browsing engine not connected</h2><p>The interface is ready, but a browsing engine still needs to be connected.</p><p>'+t.url.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</p></body>'}}
function go(raw,history){const url=clean(raw);if(!url){say('Enter a website or search.');return}const t=current();t.url=url;t.title=host(url);if(!history){t.stack=t.stack.slice(0,t.pos+1);t.stack.push(url);t.pos=t.stack.length-1}address.value=url;empty.classList.add('hidden');page.classList.add('show');t.needsLoad=true;draw();load(t)}
function togglePanel(name){$('paneltitle').textContent=name;panelbody.replaceChildren();if(name==='Menu'){[['Bookmarks','View saved pages'],['History','Recently visited pages'],['New tab','Open a new tab'],['Settings','Browser settings']].forEach(([label,sub])=>{const row=document.createElement('div');row.className='panelrow';const a=document.createElement('span');a.textContent=label+'  ·  '+sub;a.style.flex='1';row.append(a);row.addEventListener('click',()=>{panel.classList.remove('open');if(label==='Bookmarks'||label==='History')togglePanel(label);if(label==='New tab')add();if(label==='Settings')say('Settings are coming later.')});panelbody.append(row)});panel.classList.add('open');return}let items=[];try{items=JSON.parse(localStorage.getItem('browser.'+name.toLowerCase())||'[]')}catch{}if(!items.length){const p=document.createElement('div');p.className='panelrow';p.textContent='Nothing here yet.';panelbody.append(p)}items.forEach(x=>{const row=document.createElement('div');row.className='panelrow';const a=document.createElement('span');a.textContent=x.title||x.url;a.style.flex='1';row.append(a);row.addEventListener('click',()=>go(x.url));panelbody.append(row)});panel.classList.add('open')}
$('newtab').onclick=()=>add();$('addressform').onsubmit=e=>{e.preventDefault();go(address.value)};$('home').onclick=()=>{const t=current();t.url='';t.title='New Tab';t.needsLoad=false;activate(t.id)};
$('back').onclick=()=>{const t=current();if(t.pos>0){t.pos--;t.url=t.stack[t.pos];go(t.url,true)}};
$('forward').onclick=()=>{const t=current();if(t.pos<t.stack.length-1){t.pos++;t.url=t.stack[t.pos];go(t.url,true)}};
$('reload').onclick=()=>{const t=current();if(t.url){t.needsLoad=true;load(t)}};
$('save').onclick=()=>{const t=current();if(!t.url)return say('Nothing to bookmark yet.');let a=[];try{a=JSON.parse(localStorage.getItem('browser.bookmarks')||'[]')}catch{}if(!a.some(x=>x.url===t.url))a.unshift({url:t.url,title:t.title});localStorage.setItem('browser.bookmarks',JSON.stringify(a));say('Saved bookmark')};
$('bookmarks').onclick=()=>togglePanel('Bookmarks');$('history').onclick=()=>togglePanel('History');$('settings').onclick=()=>{say('Settings are coming later.')};$('menu').onclick=()=>togglePanel('Menu');$('panelclose').onclick=()=>panel.classList.remove('open');
$('panelbody').addEventListener('click',e=>{if(e.target.closest('.panelrow'))panel.classList.remove('open')});
document.addEventListener('keydown',e=>{const m=e.ctrlKey||e.metaKey;if(m&&e.key.toLowerCase()==='t'){e.preventDefault();add()}if(m&&e.key.toLowerCase()==='w'){e.preventDefault();close(active)}if(m&&e.key.toLowerCase()==='l'){e.preventDefault();address.focus();address.select()}if(m&&e.key.toLowerCase()==='r'){e.preventDefault();$('reload').click()}if(m&&e.shiftKey&&e.key.toLowerCase()==='t'){e.preventDefault();const t=closed.pop();if(t){add(t.url)}}if(e.key==='Escape')panel.classList.remove('open')});
window.BROWSER_UI={newTab:()=>add(),navigate:go,getTabs:()=>tabs.map(t=>({id:t.id,title:t.title,url:t.url}))};
window.BROWSER_APP={id:'browser',name:'Browser',version:'1.0.0',mount:root=>{root?.append?.($('app'));return window.BROWSER_UI}};
window.addEventListener('browser:open-url',e=>{if(e.detail?.url)go(e.detail.url)});
add();
})();
</script>
</body></html>
